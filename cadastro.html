<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro - Óticas Visão</title>
    <link rel="stylesheet" href="css/estilos.css">
    <link rel="stylesheet" href="css/contato.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="icon" type="image/svg+xml" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/icons/eyeglasses.svg">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body class="bg-light">

    <header class="navbar" style="justify-content: center;">
        <div class="brand">
            <a href="index.html" class="paginainicial-icone" aria-label="Página Inicial">
                <!-- Removida a classe paginainicial-img e adicionado o style inline -->
                <img src="img/logo-paginainicial.jpg" alt="Icone Home" style="height: 80px; width: auto;">
            </a>
        </div>
    </header>


    <main class="container d-flex justify-content-center align-items-center flex-grow-1 my-5">
        
        <!-- Card Flutuante Premium -->
        <div class="card border-0 shadow-lg rounded-4 p-4 p-md-5" style="max-width: 550px; width: 100%; background: #ffffff;">
            
            <div class="text-center mb-4">
                <h2 class="fw-bolder mb-2" style="color: #520909; letter-spacing: -0.5px;">Criar Conta</h2>
                <p class="text-muted fs-6">Junte-se às Óticas Visão e acompanhe seus pedidos.</p>
            </div>
            
            <div id="alertMsg" class="alert d-none text-center fw-bold" role="alert"></div>

            <form id="formCadastro" onsubmit="cadastrarUsuario(event)">
                
                <div class="mb-3">
                    <label for="nome" class="form-label fw-semibold text-dark">Nome Completo</label>
                    <input type="text" class="form-control bg-light p-3" id="nome" placeholder="Digite seu nome completo" required>
                </div>

                <div class="mb-3">
                    <label for="email" class="form-label fw-semibold text-dark">E-mail</label>
                    <input type="email" class="form-control bg-light p-3" id="email" placeholder="seuemail@exemplo.com" required>
                </div>

                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label for="senha" class="form-label fw-semibold text-dark">Senha</label>
                        <input type="password" class="form-control bg-light p-3" id="senha" placeholder="Crie uma senha" required>
                    </div>
                    <div class="col-md-6 mb-4">
                        <label for="confirmaSenha" class="form-label fw-semibold text-dark">Confirmar Senha</label>
                        <input type="password" class="form-control bg-light p-3" id="confirmaSenha" placeholder="Repita a senha" required>
                    </div>
                </div>

                <button type="submit" class="btn w-100 py-3 fw-bold rounded-pill btn-voltar-premium">
                    Cadastrar
                </button>
            </form>

            <p class="text-center mt-4 mb-0 text-muted">
                Já tem uma conta? <a href="login.html" class="fw-bold text-decoration-none" style="color: #c92525;">Entrar agora</a>
            </p>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    
    <!-- Lógica Exigida pelo PDF -->
    <script>
        function cadastrarUsuario(event) {
            event.preventDefault();

            const nome = document.getElementById('nome').value.trim();
            const email = document.getElementById('email').value.trim().toLowerCase();
            const senha = document.getElementById('senha').value;
            const confirmaSenha = document.getElementById('confirmaSenha').value;
            const alertMsg = document.getElementById('alertMsg');

            if (senha !== confirmaSenha) {
                alertMsg.className = 'alert alert-danger';
                alertMsg.innerText = 'As senhas não coincidem. Tente novamente!';
                return;
            }

            // 1. Puxa a lista de usuários salvos (ou cria uma vazia se não existir)
            let usuarios = JSON.parse(localStorage.getItem('usuariosCadastrados')) || [];

            // 2. Verifica se o e-mail já existe na lista
            let emailJaExiste = usuarios.find(u => u.email === email);
            if (emailJaExiste) {
                alertMsg.className = 'alert alert-warning';
                alertMsg.innerText = 'Este e-mail já está cadastrado. Vá para a tela de login!';
                return;
            }

            // 3. Adiciona o novo usuário na lista
            const novoUsuario = { nome, email, senha };
            usuarios.push(novoUsuario);

            // 4. Salva a lista inteira de volta na memória
            localStorage.setItem('usuariosCadastrados', JSON.stringify(usuarios));
            
            // Faz o login automático
            localStorage.setItem('usuarioLogado', JSON.stringify({ nome, email }));

            alertMsg.className = 'alert alert-success';
            alertMsg.innerText = 'Conta criada com sucesso! Redirecionando...';

            setTimeout(() => {
                window.location.href = 'index.html';
            }, 1500);
        }
    </script>

    <script>
    // Função que aplica o tema do Bootstrap baseado no sistema operacional
    function aplicarTemaDoSistema() {
        // Verifica se o navegador/sistema está no modo escuro
        const prefereEscuro = window.matchMedia('(prefers-color-scheme: dark)').matches;
        
        // Define o atributo do Bootstrap na tag <html>
        document.documentElement.setAttribute('data-bs-theme', prefereEscuro ? 'dark' : 'light');
    }

    // Aplica o tema assim que a página carrega
    aplicarTemaDoSistema();

    // Fica "ouvindo" caso o usuário mude o tema do PC com o site aberto
    window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', aplicarTemaDoSistema);
</script>


</body>
</html>
