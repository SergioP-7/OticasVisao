<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro - Óticas Visão</title>
    <link rel="stylesheet" href="css/estilos.css">
    <link rel="stylesheet" href="css/contato.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="icon" type="image/svg+xml" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/icons/eyeglasses.svg">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body class="bg-light">

    <header class="navbar" style="justify-content: center;">
        <div class="brand">
            <a href="index.html" class="paginainicial-icone" aria-label="Página Inicial">
                <img src="img/logo-paginainicial.jpg" alt="Icone Home" style="height: 80px; width: auto;">
            </a>
        </div>
    </header>

    <main class="container d-flex justify-content-center align-items-center flex-grow-1 my-5">
        
        <!-- Card Flutuante Premium -->
        <div class="card border-0 shadow-lg rounded-4 p-4 p-md-5" style="max-width: 550px; width: 100%; background: #ffffff;">
            
            <div class="text-center mb-4">
                <h2 class="fw-bolder mb-2" style="color: #520909; letter-spacing: -0.5px;">Criar Conta</h2>
                <p class="text-muted fs-6">Junte-se às Óticas Visão e acompanhe seus pedidos.</p>
            </div>
            
            <div id="alertMsg" class="alert d-none text-center fw-bold" role="alert"></div>

            <form id="formCadastro" onsubmit="cadastrarUsuario(event)" novalidate>
                
                <div class="mb-3">
                    <label for="nome" class="form-label fw-semibold text-dark">Nome Completo</label>
                    <input type="text" class="form-control bg-light p-3" id="nome" placeholder="Digite seu nome completo" required>
                </div>

                <div class="mb-3">
                    <label for="email" class="form-label fw-semibold text-dark">E-mail</label>
                    <input type="email" class="form-control bg-light p-3" id="email" placeholder="seuemail@exemplo.com" required>
                </div>

                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label for="senha" class="form-label fw-semibold text-dark">Senha</label>
                        <input type="password" class="form-control bg-light p-3" id="senha" placeholder="Mínimo 6 caracteres" required>
                    </div>
                    <div class="col-md-6 mb-4">
                        <label for="confirmaSenha" class="form-label fw-semibold text-dark">Confirmar Senha</label>
                        <input type="password" class="form-control bg-light p-3" id="confirmaSenha" placeholder="Repita a senha" required>
                    </div>
                </div>

                <button type="submit" id="btnCadastrar" class="btn w-100 py-3 fw-bold rounded-pill btn-voltar-premium">
                    Cadastrar
                </button>
            </form>

            <p class="text-center mt-4 mb-0 text-muted">
                Já tem uma conta? <a href="login.html" class="fw-bold text-decoration-none" style="color: #c92525;">Entrar agora</a>
            </p>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/global.js"></script>
    
    <!-- Integração com POST /api/register -->
    <script>
        async function cadastrarUsuario(event) {
            event.preventDefault();

            const nome = document.getElementById('nome').value.trim();
            const email = document.getElementById('email').value.trim();
            const senha = document.getElementById('senha').value;
            const confirmacaoSenha = document.getElementById('confirmaSenha').value;
            const alertMsg = document.getElementById('alertMsg');
            const btnCadastrar = document.getElementById('btnCadastrar');

            // Desabilita o botão durante a requisição para evitar duplo clique
            btnCadastrar.disabled = true;
            btnCadastrar.innerText = 'Cadastrando...';

            const res = await requisicaoAPI('/api/register', {
                method: 'POST',
                body: JSON.stringify({
                    nome,
                    email,
                    senha,
                    confirmacaoSenha
                })
            });

            btnCadastrar.disabled = false;
            btnCadastrar.innerText = 'Cadastrar';

            // Tratamento individual de cada status HTTP exigido
           if (res.status === 201) {
                // Salva a sessão do usuário recém-cadastrado no localStorage
                localStorage.setItem('usuarioLogado', JSON.stringify({ nome, email }));

                alertMsg.className = 'alert alert-success text-center fw-bold';
                alertMsg.innerText = res.dados.mensagem || 'Cadastro realizado com sucesso! Redirecionando...';

                setTimeout(() => {
                    window.location.href = 'index.html';
                }, 1500);
                return;
            }

            if (res.status === 400) {
                alertMsg.className = 'alert alert-danger text-center fw-bold';
                alertMsg.innerText = res.dados.mensagem || 'Preencha todos os campos corretamente e verifique se as senhas coincidem.';
                return;
            }

            if (res.status === 409) {
                alertMsg.className = 'alert alert-warning text-center fw-bold';
                alertMsg.innerText = res.dados.mensagem || 'Este e-mail já está cadastrado.';
                return;
            }

            if (res.status === 422) {
                alertMsg.className = 'alert alert-warning text-center fw-bold';
                alertMsg.innerText = res.dados.mensagem || 'A senha deve ter no mínimo 6 caracteres.';
                return;
            }

            // Fallback para erro de rede ou outro código inesperado
            alertMsg.className = 'alert alert-danger text-center fw-bold';
            alertMsg.innerText = res.mensagem || 'Erro ao realizar cadastro. Tente novamente.';
        }
    </script>

</body>
</html>
