<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detalhes do Pedido - Óticas Visão</title>
    <link rel="stylesheet" href="css/estilos.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="icon" type="image/svg+xml" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/icons/eyeglasses.svg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
</head>
<body>

    <!-- Cabeçalho Universal -->
    <header class="navbar">
        <div class="dropdown d-inline-block">
            <button type="button" class="btn-user-menu" data-bs-toggle="dropdown" aria-expanded="false" aria-label="Menu do usuário">
              <img src="img/icone-user.png" alt="Ícone de Usuário" class="user-img">
            </button>
            <ul class="dropdown-menu dropdown-menu-start me-3" id="menuUsuario"></ul>

        </div>


        <div class="cart-container">
            <a href="contato.html" class="loclojas-icone" aria-label="Localização das Lojas">
                <img src="img/loc-icone.jpg" alt="Icone Localização" class="loclojas-img">
            </a>
            <a href="carrinho.html" class="carrinho-icone" aria-label="Carrinho de compras">
                <img src="img/carrinho.png" alt="Carrinho de Compras" class="carrinho-img">
                <span class="cart-count">0</span>
            </a>
        </div>
    </header>

    <!-- Conteúdo Principal -->
    <main class="container my-5 flex-grow-1">
        
        <!-- Botão Voltar e Título -->
        <div class="mb-4">
            <a href="meus_pedidos.html" class="text-decoration-none text-dark fw-bold mb-3 d-inline-block">
                <i class="bi bi-arrow-left me-2"></i>Voltar para Meus Pedidos
            </a>
            <div class="d-flex flex-column flex-md-row justify-content-between align-items-md-center mt-2">
                <h2 class="mb-2 mb-md-0">Pedido <span id="num-pedido-topo" class="text-danger">#0000</span></h2>
                <span id="badge-status" class="badge px-3 py-2 fs-6 rounded-pill">Status</span>
            </div>
        </div>

        <!-- Área onde o JavaScript vai desenhar os detalhes -->
        <div id="area-detalhes-pedido">
            <!-- Caso não encontre o pedido, esta mensagem aparece -->
            <div class="alert alert-warning text-center p-4">
                <i class="bi bi-exclamation-triangle fs-1 d-block mb-3"></i>
                A carregar informações do pedido...
            </div>
        </div>

    </main>

    <!-- Rodapé -->
    <footer class="bg-light mt-5 py-4 border-top">
        <div class="container text-center">
            <div class="row mb-4">
                <div class="col-12 d-flex flex-column flex-md-row justify-content-center gap-4">
                    <a href="https://wa.me/5561996696971" target="_blank" class="btn btn-light d-flex align-items-center justify-content-center gap-2 text-dark px-3 py-2 btn-contato">
                        <i class="bi bi-whatsapp fs-4 social-icon"></i>
                        <span class="fw-bold">Converse com um Consultor Ótico!</span>
                    </a>
                    <a href="https://www.instagram.com/oticasvisaoformosa/" target="_blank" class="btn btn-light d-flex align-items-center justify-content-center gap-2 text-dark px-3 py-2 btn-contato">
                        <i class="bi bi-instagram fs-4 social-icon"></i>
                        <span class="fw-bold">Nos siga no Instagram</span>
                    </a>
                </div>
            </div>
            <div class="row">
                <div class="col-12">
                    <hr class="text-muted">
                    <p class="mb-0 text-muted small">&copy; 2026 Óticas Visão. Todos os direitos reservados.</p>
                </div>
            </div>
        </div>
    </footer>

    <!-- Scripts Básicos e Lógica da Página -->
    <script>
        // Formatar Moeda
        const formatarMoeda = (valor) => valor.toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });

        // Funções de Cabeçalho Universais
        function atualizarBadgeCarrinho() {
            let carrinho = JSON.parse(localStorage.getItem('carrinhoOtica')) || [];
            let totalItens = carrinho.reduce((total, p) => total + p.quantidade, 0);
            const badge = document.querySelector('.cart-count');
            const imgCarrinho = document.querySelector('.carrinho-img');
            if (badge) { badge.innerText = totalItens; badge.style.display = totalItens > 0 ? 'inline-block' : 'none'; }
            if (imgCarrinho) {
                imgCarrinho.src = totalItens > 0 ? 'img/carrinho-cheio.png' : 'img/carrinho.png';
                totalItens > 0 ? imgCarrinho.classList.add('carrinho-cheio') : imgCarrinho.classList.remove('carrinho-cheio');
            }
        }

        function atualizarMenuUsuario() {
            // Vai à memória procurar se há alguém logado
            const usuarioLogado = JSON.parse(localStorage.getItem('usuarioLogado'));
            const menuUsuario = document.getElementById('menuUsuario');

            if (!menuUsuario) return;

            if (usuarioLogado) {
                // SE ESTIVER LOGADO: Mostra o Nome, Meus Dados, Meus Pedidos + Carrinho e Contato
                menuUsuario.innerHTML = `
                     <li><span class="dropdown-item-text fw-bold" style="color: #350909 !important; 
                            ;">Olá, ${usuarioLogado.nome.split(' ')[0]}!</span></li>
                     <li><hr class="dropdown-divider"></li>
                     <li><a class="dropdown-item" href="index.html"><strong>Meus Dados</strong></a></li>
                     <li><a class="dropdown-item" href="meus_pedidos.html"><strong>Meus Pedidos</strong></a></li>
                     <li><a class="dropdown-item" href="carrinho.html"><strong>Carrinho</strong></a></li>
                     <li><a class="dropdown-item" href="contato.html"><strong>Contato</strong></a></li>
                     <li><hr class="dropdown-divider"></li>
                     <li><a class="dropdown-item text-danger"  onclick="fazerLogout(event)" style="color: #350909 !important;"><strong>Sair</strong></a></li>
                `;
            } else {
                // SE NÃO ESTIVER LOGADO: Mostra a opção de Login + Carrinho e Contato
                menuUsuario.innerHTML = `
                     <li><a class="dropdown-item" href="login.html" style="color: #350909 !important;"><strong>Login / Cadastrar-se</strong></a></li>
                     <li><a class="dropdown-item" href="carrinho.html" style="color: #350909 !important;"><strong>Carrinho</strong></a></li>
                     <li><hr class="dropdown-divider"></li>
                     <li><a class="dropdown-item" href="contato.html";"><strong>Contato</strong></a></li>
                `;
            }
        }


        function fazerLogout(e) {
            e.preventDefault();
            localStorage.removeItem('usuarioLogado');
            window.location.href = 'index.html'; 
        }

        // --- A MÁGICA DESTA PÁGINA: CARREGAR O PEDIDO EXATO ---
        function carregarDetalhesPedido() {
            // 1. Lê a barra de endereços para ver qual é o ID (ex: ?id=1002)
            const parametros = new URLSearchParams(window.location.search);
            const pedidoId = parseInt(parametros.get('id'));

            // 2. Procura os pedidos na memória
            const pedidos = JSON.parse(localStorage.getItem('pedidosOtica')) || [];
            
            // 3. Filtra a lista para encontrar APENAS o pedido com o ID correto
            const pedidoEncontrado = pedidos.find(p => p.id === pedidoId);
            const areaDetalhes = document.getElementById('area-detalhes-pedido');

            // Se alguém tentar inventar um número de pedido falso no link:
            if (!pedidoEncontrado) {
                document.getElementById('num-pedido-topo').innerText = "Inválido";
                document.getElementById('badge-status').style.display = 'none';
                areaDetalhes.innerHTML = `
                    <div class="alert alert-danger text-center p-5 mt-4">
                        <h4>Pedido não encontrado!</h4>
                        <p>O número de pedido informado não existe na sua conta.</p>
                        <a href="meus_pedidos.html" class="btn btn-dark mt-3">Voltar aos meus pedidos</a>
                    </div>`;
                return;
            }

            // Se o pedido existe, vamos atualizar o Título e o Badge
            document.getElementById('num-pedido-topo').innerText = `#${pedidoEncontrado.id}`;
            const badge = document.getElementById('badge-status');
            badge.innerText = pedidoEncontrado.status;
            
            // Pinta a pílula de cor diferente consoante o status (amarelo para Separação, verde para Entregue)
            if(pedidoEncontrado.status === "Em Separação") {
                badge.className = "badge bg-warning text-dark px-3 py-2 fs-6 rounded-pill";
            } else {
                badge.className = "badge bg-success px-3 py-2 fs-6 rounded-pill";
            }

            // 4. Constrói a lista com as fotos dos produtos que estavam no carrinho nessa compra
            let htmlProdutos = '';
            pedidoEncontrado.itens.forEach(item => {
                htmlProdutos += `
                    <div class="d-flex align-items-center border-bottom py-3">
                        <img src="${item.imagem}" alt="${item.titulo}" class="img-fluid rounded me-3" style="width: 80px; height: 80px; object-fit: contain; background: #f8f9fa; padding: 5px;">
                        <div class="flex-grow-1">
                            <h6 class="mb-1 fw-bold">${item.titulo}</h6>
                            <p class="text-muted mb-0 small">Qtd: ${item.quantidade} x ${formatarMoeda(item.preco)}</p>
                        </div>
                        <div class="fw-bold text-dark">
                            ${formatarMoeda(item.preco * item.quantidade)}
                        </div>
                    </div>
                `;
            });

            // 5. Injeta o Layout completo na área principal
            areaDetalhes.innerHTML = `
                <div class="row g-4 mt-2">
                    <!-- Coluna dos Itens do Pedido -->
                    <div class="col-lg-8">
                        <div class="card shadow-sm border-0">
                            <div class="card-header bg-white pt-3 pb-2 border-bottom">
                                <h5 class="fw-bold mb-0">Itens do Pedido</h5>
                            </div>
                            <div class="card-body">
                                ${htmlProdutos}
                            </div>
                        </div>
                    </div>

                    <!-- Coluna do Resumo de Valores -->
                    <div class="col-lg-4">
                        <div class="card shadow-sm border-0 bg-light">
                            <div class="card-body p-4">
                                <h5 class="fw-bold mb-4">Resumo da Compra</h5>
                                
                                <div class="d-flex justify-content-between mb-2 text-muted">
                                    <span>Data da Compra:</span>
                                    <span>${pedidoEncontrado.data}</span>
                                </div>
                                <div class="d-flex justify-content-between mb-2 text-muted">
                                    <span>Subtotal (${pedidoEncontrado.totalItens} ${pedidoEncontrado.totalItens === 1 ? 'item' : 'itens'}):</span>
                                    <span>${formatarMoeda(pedidoEncontrado.valorTotal)}</span>
                                </div>
                                <div class="d-flex justify-content-between mb-3 text-muted">
                                    <span>Frete:</span>
                                    <span class="text-success fw-bold">Grátis</span>
                                </div>
                                <hr>
                                <div class="d-flex justify-content-between fw-bold fs-5 mt-3 text-danger">
                                    <span>Total Pago:</span>
                                    <span>${formatarMoeda(pedidoEncontrado.valorTotal)}</span>
                                </div>
                                
                                <button class="btn btn-outline-dark w-100 mt-4" onclick="window.print()">
                                    <i class="bi bi-printer me-2"></i>Imprimir Recibo
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            `;
        }

        // --- INICIALIZA TUDO AO ABRIR ---
        document.addEventListener('DOMContentLoaded', () => {
            atualizarBadgeCarrinho();
            atualizarMenuUsuario();
            carregarDetalhesPedido();
            
            const tooltipTriggerList = document.querySelectorAll('[data-bs-toggle="tooltip"]');
            [...tooltipTriggerList].map(tooltipTriggerEl => new bootstrap.Tooltip(tooltipTriggerEl));
        });
    </script>


<script>
    // Função que aplica o tema do Bootstrap baseado no sistema operacional
    function aplicarTemaDoSistema() {
        // Verifica se o navegador/sistema está no modo escuro
        const prefereEscuro = window.matchMedia('(prefers-color-scheme: dark)').matches;
        
        // Define o atributo do Bootstrap na tag <html>
        document.documentElement.setAttribute('data-bs-theme', prefereEscuro ? 'dark' : 'light');
    }

    // Aplica o tema assim que a página carrega
    aplicarTemaDoSistema();

    // Fica "ouvindo" caso o usuário mude o tema do PC com o site aberto
    window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', aplicarTemaDoSistema);
</script>


    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
