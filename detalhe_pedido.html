<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detalhes do Pedido - Óticas Visão</title>
    <link rel="stylesheet" href="css/estilos.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="icon" type="image/svg+xml" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/icons/eyeglasses.svg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <style>
    @media print {
        header.navbar .dropdown,
        header.navbar .cart-container,
        footer,
        .d-print-none {
            display: none !important;
        }
        header.navbar {
            justify-content: center !important;
            border-bottom: 1px solid #ddd !important;
        }
    }
</style>

</head>
<body>

    <!-- Cabeçalho Universal -->
    <header class="navbar">
        <div class="dropdown d-inline-block">
            <button type="button" class="btn-user-menu" data-bs-toggle="dropdown" aria-expanded="false" aria-label="Menu do usuário">
              <img src="img/icone-user.png" alt="Ícone de Usuário" class="user-img">
            </button>
            <ul class="dropdown-menu dropdown-menu-start me-3" id="menuUsuario"></ul>
        </div>

        <div class="cart-container">
            <a href="contato.html" class="loclojas-icone" aria-label="Localização das Lojas">
                <img src="img/loc-icone.jpg" alt="Icone Localização" class="loclojas-img">
            </a>
            <a href="carrinho.html" class="carrinho-icone" aria-label="Carrinho de compras">
                <img src="img/carrinho.png" alt="Carrinho de Compras" class="carrinho-img">
                <span class="cart-count">0</span>
            </a>
        </div>
    </header>

    <!-- Conteúdo Principal -->
    <main class="container my-5 flex-grow-1">
        
        <!-- Botão Voltar e Título -->
        <div class="mb-4">
            <a href="meus_pedidos.html" class="text-decoration-none text-dark fw-bold mb-3 d-inline-block d-print-none">
                <i class="bi bi-arrow-left me-2"></i>Voltar para Meus Pedidos
            </a>
            <div class="d-flex flex-column flex-md-row justify-content-between align-items-md-center mt-2">
                <h2 class="mb-2 mb-md-0">Pedido <span id="num-pedido-topo" class="text-danger">#0000</span></h2>
                <span id="badge-status" class="badge px-3 py-2 fs-6 rounded-pill text-capitalize">Status</span>
            </div>
        </div>

        <!-- Área onde o JavaScript vai desenhar os detalhes -->
        <div id="area-detalhes-pedido">
            <div class="alert alert-warning text-center p-4">
                <i class="bi bi-exclamation-triangle fs-1 d-block mb-3"></i>
                Carregando informações do pedido...
            </div>
        </div>

    </main>

    <!-- Rodapé -->
    <footer class="bg-light mt-5 py-4 border-top d-print-none">
        <div class="container text-center">
            <div class="row mb-4">
                <div class="col-12 d-flex flex-column flex-md-row justify-content-center gap-4">
                    <a href="https://wa.me/5561996696971" target="_blank" class="btn btn-light d-flex align-items-center justify-content-center gap-2 text-dark px-3 py-2 btn-contato">
                        <i class="bi bi-whatsapp fs-4 social-icon"></i>
                        <span class="fw-bold">Converse com um Consultor Ótico!</span>
                    </a>
                    <a href="https://www.instagram.com/oticasvisaoformosa/" target="_blank" class="btn btn-light d-flex align-items-center justify-content-center gap-2 text-dark px-3 py-2 btn-contato">
                        <i class="bi bi-instagram fs-4 social-icon"></i>
                        <span class="fw-bold">Nos siga no Instagram</span>
                    </a>
                </div>
            </div>
            <div class="row">
                <div class="col-12">
                    <hr class="text-muted">
                    <p class="mb-0 text-muted small">&copy; 2026 Óticas Visão. Todos os direitos reservados.</p>
                </div>
            </div>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/global.js"></script>

    <script>
        const formatarMoeda = (valor) => Number(valor || 0).toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });

        function formatarMetodoPagamento(metodo) {
            const mapa = {
                pix: 'PIX (Aprovação imediata)',
                boleto: 'Boleto Bancário',
                cartao: 'Cartão de Crédito'
            };
            return mapa[(metodo || '').toLowerCase()] || metodo || 'Não informado';
        }

        function obterClasseBadgeStatus(status) {
            const s = (status || '').toLowerCase();
            if (s === 'cancelado') return 'badge bg-danger text-white px-3 py-2 fs-6 rounded-pill text-capitalize';
            if (s === 'entregue') return 'badge bg-success text-white px-3 py-2 fs-6 rounded-pill text-capitalize';
            return 'badge bg-warning text-dark px-3 py-2 fs-6 rounded-pill text-capitalize';
        }

        // Carrega os detalhes completos do pedido pelo protocolo na URL (?id=PED-2026-XXXX)
        function carregarDetalhesPedido() {
            const parametros = new URLSearchParams(window.location.search);
            const protocoloBuscado = parametros.get('id');

            const pedidos = JSON.parse(localStorage.getItem('pedidosOtica')) || [];
            const pedidoEncontrado = pedidos.find(p => (p.protocolo || String(p.id)) === protocoloBuscado);
            const areaDetalhes = document.getElementById('area-detalhes-pedido');

            if (!pedidoEncontrado) {
                document.getElementById('num-pedido-topo').innerText = 'Inválido';
                document.getElementById('badge-status').style.display = 'none';
                areaDetalhes.innerHTML = `
                    <div class="alert alert-danger text-center p-5 mt-4">
                        <h4>Pedido não encontrado!</h4>
                        <p>O protocolo de pedido informado não existe na sua conta.</p>
                        <a href="meus_pedidos.html" class="btn btn-dark mt-3">Voltar aos meus pedidos</a>
                    </div>`;
                return;
            }

            const protocolo = pedidoEncontrado.protocolo || String(pedidoEncontrado.id);
            const statusAtual = pedidoEncontrado.status || 'Aprovado';

            document.getElementById('num-pedido-topo').innerText = `#${protocolo}`;
            const badge = document.getElementById('badge-status');
            badge.innerText = statusAtual;
            badge.className = obterClasseBadgeStatus(statusAtual);

            const itens = Array.isArray(pedidoEncontrado.itens) ? pedidoEncontrado.itens : [];
            const htmlProdutos = itens.map(item => `
                <div class="d-flex align-items-center border-bottom py-3">
                    <img src="${item.imagem}" alt="${item.titulo}" class="img-fluid rounded me-3" style="width: 80px; height: 80px; object-fit: contain; background: #f8f9fa; padding: 5px;">
                    <div class="flex-grow-1">
                        <h6 class="mb-1 fw-bold">${item.titulo}</h6>
                        <p class="text-muted mb-0 small">Qtd: ${item.quantidade} x ${formatarMoeda(item.preco)}</p>
                    </div>
                    <div class="fw-bold text-dark">
                        ${formatarMoeda(item.preco * item.quantidade)}
                    </div>
                </div>
            `).join('');

            const subtotalProdutos = pedidoEncontrado.valorProdutos !== undefined
                ? pedidoEncontrado.valorProdutos
                : (pedidoEncontrado.valorTotal || 0);
            const valorFrete = pedidoEncontrado.valorFrete || 0;
            const valorDesconto = pedidoEncontrado.desconto || 0;
            const totalPago = pedidoEncontrado.valorTotal !== undefined
                ? pedidoEncontrado.valorTotal
                : Math.max(0, subtotalProdutos + valorFrete - valorDesconto);

            const linhaFrete = valorFrete > 0
                ? `<span class="fw-semibold text-dark">${formatarMoeda(valorFrete)}${pedidoEncontrado.servicoFrete ? ` (${pedidoEncontrado.servicoFrete})` : ''}</span>`
                : `<span class="text-success fw-bold">Grátis</span>`;

            const linhaDesconto = valorDesconto > 0
                ? `
                <div class="d-flex justify-content-between mb-2 text-success">
                    <span>Desconto${pedidoEncontrado.cupom ? ` (${pedidoEncontrado.cupom})` : ''}:</span>
                    <span class="fw-bold">- ${formatarMoeda(valorDesconto)}</span>
                </div>`
                : '';

            const blocoEndereco = pedidoEncontrado.endereco
                ? `<p class="text-muted small mb-0 mt-1"><i class="bi bi-geo-alt me-1"></i>${pedidoEncontrado.endereco}</p>`
                : '';

            areaDetalhes.innerHTML = `
                <div class="row g-4 mt-2">
                    <!-- Coluna dos Itens e Entrega -->
                    <div class="col-lg-8">
                        <div class="card shadow-sm border-0 mb-4">
                            <div class="card-header bg-white pt-3 pb-2 border-bottom">
                                <h5 class="fw-bold mb-0">Itens do Pedido</h5>
                            </div>
                            <div class="card-body">
                                ${htmlProdutos}
                            </div>
                        </div>

                        <div class="card shadow-sm border-0">
                            <div class="card-header bg-white pt-3 pb-2 border-bottom">
                                <h5 class="fw-bold mb-0">Entrega e Pagamento</h5>
                            </div>
                            <div class="card-body">
                                <div class="row g-3">
                                    <div class="col-md-6">
                                        <small class="text-muted d-block fw-semibold">CEP de Entrega</small>
                                        <span class="fw-bold">${pedidoEncontrado.cep || 'Não informado'}</span>
                                        ${blocoEndereco}
                                    </div>
                                    <div class="col-md-6">
                                        <small class="text-muted d-block fw-semibold">Forma de Pagamento</small>
                                        <span class="fw-bold">${formatarMetodoPagamento(pedidoEncontrado.metodoPagamento)}</span>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- Coluna do Resumo de Valores -->
                    <div class="col-lg-4">
                        <div class="card shadow-sm border-0 bg-light">
                            <div class="card-body p-4">
                                <h5 class="fw-bold mb-4">Resumo da Compra</h5>
                                
                                <div class="d-flex justify-content-between mb-2 text-muted">
                                    <span>Protocolo:</span>
                                    <span class="fw-bold text-dark">${protocolo}</span>
                                </div>
                                <div class="d-flex justify-content-between mb-2 text-muted">
                                    <span>Data da Compra:</span>
                                    <span>${pedidoEncontrado.data || '-'}</span>
                                </div>
                                <div class="d-flex justify-content-between mb-2 text-muted">
                                    <span>Subtotal (${pedidoEncontrado.totalItens} ${pedidoEncontrado.totalItens === 1 ? 'item' : 'itens'}):</span>
                                    <span>${formatarMoeda(subtotalProdutos)}</span>
                                </div>
                                <div class="d-flex justify-content-between mb-2 text-muted">
                                    <span>Frete:</span>
                                    ${linhaFrete}
                                </div>
                                ${linhaDesconto}
                                <hr>
                                <div class="d-flex justify-content-between fw-bold fs-5 mt-3 text-danger">
                                    <span>Total Pago:</span>
                                    <span>${formatarMoeda(totalPago)}</span>
                                </div>
                                
                                <button class="btn btn-outline-dark w-100 mt-4 d-print-none" onclick="window.print()">
                                    <i class="bi bi-printer me-2"></i>Imprimir Recibo
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            `;
        }

        document.addEventListener('DOMContentLoaded', () => {
            carregarDetalhesPedido();
        });
    </script>
</body>
</html>
