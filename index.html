<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Óticas Visão</title>
    <link rel="stylesheet" href="css/estilos.css">
    <link rel="stylesheet" href="css/pagdeprodutos.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="icon" type="image/svg+xml" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/icons/eyeglasses.svg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
</head>
<body>

  <header class="navbar">

    <!-- Menu do usuário -->
    <div class="dropdown" style="display: inline-block;">
        <button type="button" class="btn-user-menu" data-bs-toggle="dropdown" 
        aria-expanded="false" aria-label="Menu do usuário">
          <img src="img/icone-user.png" alt="Ícone de Usuário" class="user-img">
        </button>

        <ul class="dropdown-menu dropdown-menu-start me-3" id="menuUsuario">
             <!-- O js/global.js injeta os links aqui dentro automaticamente -->
        </ul>
    </div>

    <!-- Busca envia direto para pagdeprodutos.html?busca=... -->
    <form class="caixa-pesquisa" action="pagdeprodutos.html" method="GET">
        <input type="text" name="busca" placeholder="Buscar produtos, categorias...">
        <button type="submit">Buscar</button>
    </form>
        
    <div class="brand">
        <a href="index.html" class="paginainicial-icone" aria-label="Página Inicial">
            <img src="img/logo-paginainicial.jpg" alt="Icone Home" class="paginainicial-img">
        </a>
    </div>

  </header>

  <main class="home-container">

   <div id="carouselHome" class="carousel slide position-relative shadow-sm rounded-4 
   overflow-hidden mb-1" data-bs-ride="carousel">
  
      <!-- Indicadores -->
      <div class="carousel-indicators">
        <button type="button" data-bs-target="#carouselHome" data-bs-slide-to="0" class="active" 
        aria-current="true" aria-label="Slide 1"></button>
        <button type="button" data-bs-target="#carouselHome" data-bs-slide-to="1" 
        aria-label="Slide 2"></button>
        <button type="button" data-bs-target="#carouselHome" data-bs-slide-to="2" 
        aria-label="Slide 3"></button>
      </div>

      <!-- Slides apontando diretamente para pagdeprodutos.html -->
      <div class="carousel-inner">
        <div class="carousel-item active">
          <img src="img/banner1.png" class="d-block w-100 carousel-img" alt="Produtos em alta!">
          <div class="carousel-caption">
            <a href="pagdeprodutos.html" class="btn btn-light mt-2 fw-bold">Mais Procurados</a>
          </div>
        </div>
        
        <div class="carousel-item">
          <img src="img/banner2.png" class="d-block w-100 carousel-img" alt="Ofertas Especiais!">
          <div class="carousel-caption">
           <a href="pagdeprodutos.html" class="btn btn-light mt-2 fw-bold">Ofertas Especiais</a> 
          </div>
        </div>

        <div class="carousel-item">
          <img src="img/banner3.jpg" class="d-block w-100 carousel-img" alt="Novidades!">
          <div class="carousel-caption">
            <a href="pagdeprodutos.html" class="btn btn-light mt-2 fw-bold">Novidades 2026!</a>
          </div>
        </div>
      </div>

      <!-- Botões de navegação lateral (Setas) -->
      <button class="carousel-control-prev position-absolute top-50 start-0 translate-middle-y ms-3 
      carousel-btn-custom" type="button" data-bs-target="#carouselHome" data-bs-slide="prev">
        <span class="carousel-control-prev-icon" aria-hidden="true"></span>
        <span class="visually-hidden">Anterior</span>
      </button>
      
      <button class="carousel-control-next position-absolute top-50 end-0 translate-middle-y me-3 
      carousel-btn-custom" type="button" data-bs-target="#carouselHome" data-bs-slide="next">
        <span class="carousel-control-next-icon" aria-hidden="true"></span>
        <span class="visually-hidden">Próximo</span>
      </button>

   </div>

   <!-- Cards dinâmicos carregados da API nas categorias correspondentes -->
   <section class="categorias-destaque" id="categorias-destaque">
    <a href="pagdeprodutos.html?categoria=Eletrônicos" class="card-link">
        <div class="card-categoria">
            <img src="img/oculos1.png" alt="Eletrônicos" id="img-destaque-1">
            <h3>ELETRÔNICOS</h3>
        </div>
    </a>

    <a href="pagdeprodutos.html?categoria=Acessórios" class="card-link">
        <div class="card-categoria">
            <img src="img/oculos4.png" alt="Acessórios" id="img-destaque-2">
            <h3>ACESSÓRIOS</h3>
        </div>
    </a>

    <a href="pagdeprodutos.html?categoria=Vestuário" class="card-link">
        <div class="card-categoria">
            <img src="img/oculos2.png" alt="Vestuário" id="img-destaque-3">
            <h3>VESTUÁRIO</h3>
        </div>
    </a>
   </section>

  </main>

  <footer class="bg-light mt-5 py-4 border-top">
    <div class="container text-center">
        <div class="row mb-4">
            <div class="col-12 d-flex flex-column flex-md-row justify-content-center gap-4">
                <a href="https://wa.me/5561996696971" target="_blank" class="btn btn-light d-flex align-items-center justify-content-center gap-2 text-dark px-3 py-2 btn-contato">
                    <i class="bi bi-whatsapp fs-4 social-icon"></i>
                    <span class="fw-bold">Converse com um Consultor Ótico!</span>
                </a>
                <a href="https://www.instagram.com/oticasvisaoformosa/" target="_blank" class="btn btn-light d-flex align-items-center justify-content-center gap-2 text-dark px-3 py-2 btn-contato">
                    <i class="bi bi-instagram fs-4 social-icon"></i>
                    <span class="fw-bold">Nos siga no Instagram</span>
                </a>
            </div>
        </div>
        
        <div class="row">
            <div class="col-12">
                <hr class="text-muted">
                <p class="mb-0 text-muted small">&copy; 2026 Óticas Visão. Todos os direitos reservados.</p>
            </div>
        </div>
    </div>
  </footer>

  <!-- Bootstrap primeiro, depois js/global.js -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/global.js"></script>

  <!-- Carrega as imagens reais dos produtos da API para os 3 cards de destaque -->
  <script>
    document.addEventListener("DOMContentLoaded", async () => {
      const res = await requisicaoAPI("/api/products");
      if (!res.ok || !res.dados.products) return;

      const produtos = res.dados.products;
      const mapaDestaques = [
        { categoria: "Eletrônicos", imgId: "img-destaque-1" },
        { categoria: "Acessórios", imgId: "img-destaque-2" },
        { categoria: "Vestuário", imgId: "img-destaque-3" }
      ];

      mapaDestaques.forEach(item => {
        const produtoEncontrado = produtos.find(p => p.category === item.categoria);
        const imgEl = document.getElementById(item.imgId);
        if (produtoEncontrado && imgEl) {
          imgEl.src = produtoEncontrado.image;
          imgEl.alt = produtoEncontrado.name;
        }
      });
    });
  </script>
</body>
</html>
