<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Óticas Visão</title>
    <link rel="stylesheet" href="estilos.css">
</head>
<body>

    <!-- Menu de Navegação -->
    <header class="navbar">
        <div class="brand">
            <img src="img/logoifg.png" alt="Logo" class="logo">
            <span class="titulo-site">Óticas Visão</span>
        </div>

        <!-- Barra de pesquisa -->
        <div class="caixa-pesquisa">
            <input type="text" placeholder="Buscar produtos...">
            <button type="submit">Buscar</button>
        </div>

        <!-- Botão de Carrinho -->
        <div class="cart-container">
            <a href="paginadecarrinho.com" class="carrinho-icone" aria-label="Carrinho de compras">
                <img src="img/carrinho.png" alt="Carrinho de Compras" class="carrinho-img">
                <span class="cart-count">3</span>
            </a>
        </div>
    </header>

</body>
</html>
