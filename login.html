<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Óticas Visão</title>
    <link rel="stylesheet" href="css/estilos.css">
    <link rel="stylesheet" href="css/contato.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="icon" type="image/svg+xml" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/icons/eyeglasses.svg">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body class="bg-light">

     <header class="navbar" style="justify-content: center;">
        <div class="brand">
            <a href="index.html" class="paginainicial-icone" aria-label="Página Inicial">
                <img src="img/logo-paginainicial.jpg" alt="Icone Home" style="height: 80px; width: auto;">
            </a>
        </div>
    </header>


    <main class="container d-flex justify-content-center align-items-center flex-grow-1 my-5">
        
        <!-- Card Flutuante Premium -->
        <div class="card border-0 shadow-lg rounded-4 p-4 p-md-5" style="max-width: 480px; width: 100%; background: #ffffff;">
            
            <div class="text-center mb-4">
                <div class="mb-3">
                    <i class="bi bi-person-circle" style="font-size: 3rem; color: #741111;"></i>
                </div>
                <h2 class="fw-bolder mb-2" style="color: #520909; letter-spacing: -0.5px;">Acessar Conta</h2>
                <p class="text-muted fs-6">Insira seus dados para entrar.</p>
            </div>
            
            <div id="alertMsg" class="alert d-none text-center fw-bold" role="alert"></div>

            <form id="formLogin" novalidate>
                
                <div class="mb-3">
                    <label for="email" class="form-label fw-semibold text-dark">E-mail</label>
                    <input type="text" class="form-control bg-light p-3" id="email" placeholder="seuemail@exemplo.com">
                </div>

                <div class="mb-4">
                    <label for="senha" class="form-label fw-semibold text-dark">Senha</label>
                    <input type="password" class="form-control bg-light p-3" id="senha" placeholder="Sua senha secreta">
                </div>

                <button type="submit" class="btn w-100 py-3 fw-bold rounded-pill btn-voltar-premium">
                    Entrar
                </button>
            </form>


            <p class="text-center mt-4 mb-0 text-muted">
                Ainda não tem conta? <a href="cadastro.html" class="fw-bold text-decoration-none" style="color: #c92525;">Cadastrar-se</a>
            </p>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/global.js"></script>



    <script>
        document.addEventListener("DOMContentLoaded", () => {
  const formLogin = document.getElementById("formLogin");
  const alertMsg = document.getElementById("alertMsg");

  // Função auxiliar para mostrar avisos na tela de login
  function mostrarAlerta(texto, tipo = "danger") {
    alertMsg.className = `alert alert-${tipo}`;
    alertMsg.textContent = texto;
    alertMsg.classList.remove("d-none");
  }

  if (formLogin) {
    formLogin.addEventListener("submit", async (e) => {
      e.preventDefault();

      const email = document.getElementById("email").value.trim();
      const senha = document.getElementById("senha").value;

      // Chama a função que está no js/global.js
      const res = await requisicaoAPI("/api/login", {
        method: "POST",
        body: JSON.stringify({ email, senha })
      });

      if (!res.ok) {
        // Exibe automaticamente erro 400 (campos vazios) ou 401 (credenciais inválidas)
        mostrarAlerta(res.mensagem, "danger");
        return;
      }

      // Salva no localStorage exatamente no padrão do seu projeto e redireciona
      localStorage.setItem("usuarioLogado", JSON.stringify(res.dados.usuario));
      window.location.href = "index.html";
    });
  }
});
    </script>



</body>
</html>
