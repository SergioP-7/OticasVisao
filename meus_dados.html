<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meus Dados - Óticas Visão</title>
    <link rel="stylesheet" href="css/estilos.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="icon" type="image/svg+xml" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/icons/eyeglasses.svg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
</head>
<body>

    <header class="navbar">
        <div class="dropdown" style="display: inline-block;">
            <button type="button" class="btn-user-menu" data-bs-toggle="dropdown" aria-expanded="false" aria-label="Menu do usuário">
              <img src="img/icone-user.png" alt="Ícone de Usuário" class="user-img">
            </button>
            <ul class="dropdown-menu dropdown-menu-start me-3" id="menuUsuario"></ul>
        </div>    
            
        <div class="brand">
            <a href="index.html" class="paginainicial-icone" aria-label="Página Inicial">
                <img src="img/logo-paginainicial.jpg" alt="Icone Home" class="paginainicial-img">
            </a>
        </div>
    </header>

    <main class="container my-5 flex-grow-1">
        <div class="row justify-content-center">
            
            <!-- Coluna Principal Centralizada (Sem o aside lateral) -->
            <div class="col-lg-9">
                
                <!-- 1. Cartão de Dados Pessoais -->
                <div class="card shadow-sm border-0 p-4 mb-4">
                    <h3 class="h4 mb-4 fw-bold">Alterar Dados Pessoais</h3>

                    <div id="alertMsg" class="d-none mb-3" role="alert"></div>

                    <form onsubmit="salvarDados(event)" novalidate>
                        <div class="row g-3">
                            <div class="col-md-6">
                                <label for="nome" class="form-label fw-bold">Nome Completo</label>
                                <input type="text" class="form-control p-3" id="nome" placeholder="Seu nome completo">
                            </div>
                            <div class="col-md-6">
                                <label for="email" class="form-label fw-bold">E-mail</label>
                                <input type="email" class="form-control p-3" id="email" placeholder="seuemail@exemplo.com">
                            </div>

                            <hr class="my-4">

                            <h5 class="fw-bold mb-3">Alterar Senha (Opcional)</h5>

                            <div class="col-md-6">
                                <label for="novaSenha" class="form-label fw-bold">Nova Senha</label>
                                <input type="password" class="form-control p-3" id="novaSenha" placeholder="Deixe em branco para manter a atual">
                            </div>

                            <div class="col-md-6">
                                <label for="confirmaSenha" class="form-label fw-bold">Confirmar Nova Senha</label>
                                <input type="password" class="form-control p-3" id="confirmaSenha" placeholder="Repita a nova senha">
                            </div>

                            <div class="col-12 mt-4 text-end">
                                <button type="submit" id="btnSalvarDados" class="btn btn-dark btn-lg px-5 fw-bold">Alterar meus dados</button>
                            </div>
                        </div>
                    </form>
                </div>

                <!-- 2. Cartão de Endereços de Entrega -->
                <div class="card shadow-sm border-0 p-4">
                    <div class="d-flex justify-content-between align-items-center mb-4">
                        <h3 class="h4 mb-0 fw-bold">Endereços de Entrega</h3>
                        <button type="button" class="btn btn-outline-dark fw-bold" data-bs-toggle="modal" data-bs-target="#modalEndereco">
                            <i class="bi bi-plus-lg me-2"></i>Novo Endereço
                        </button>
                    </div>

                    <div class="row g-3" id="container-enderecos"></div>
                </div>

            </div>
        </div>
    </main>

    <!-- Modal do Bootstrap para Cadastrar Novo Endereço -->
    <div class="modal fade" id="modalEndereco" tabindex="-1" aria-labelledby="modalEnderecoLabel" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content border-0 shadow">
                <div class="modal-header border-0">
                    <h5 class="modal-title fw-bold" id="modalEnderecoLabel">Cadastrar Endereço</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Fechar"></button>
                </div>
                <div class="modal-body">
                    <div id="alertaViaCep" class="alert alert-warning py-2 px-3 small d-none" role="alert"></div>

                    <form id="formNovoEndereco" onsubmit="adicionarEndereco(event)">
                        <div class="mb-3">
                            <label for="rotulo" class="form-label fw-bold">Identificação (Ex: Casa, Trabalho)</label>
                            <input type="text" class="form-control" id="rotulo" required placeholder="Ex: Minha Casa">
                        </div>
                        <div class="row g-2 mb-3">
                            <div class="col-6">
                                <label for="cep" class="form-label fw-bold">CEP</label>
                                <input type="text" class="form-control" id="cep" required maxlength="9" placeholder="73800-000" oninput="formatarCepModal(this)" onblur="consultarViaCEP(this.value)">
                            </div>
                            <div class="col-6">
                                <label for="cidadeEstado" class="form-label fw-bold">Cidade / UF</label>
                                <input type="text" class="form-control" id="cidadeEstado" required placeholder="Formosa / GO">
                            </div>
                        </div>
                        <div class="mb-3">
                            <label for="rua" class="form-label fw-bold">Rua e Número</label>
                            <input type="text" class="form-control" id="rua" required placeholder="Ex: Rua João Moreira, 123">
                        </div>
                        <div class="mb-3">
                            <label for="bairro" class="form-label fw-bold">Bairro</label>
                            <input type="text" class="form-control" id="bairro" required placeholder="Ex: Centro">
                        </div>
                        <button type="submit" class="btn btn-dark w-100 fw-bold py-2 mt-2">Salvar Endereço</button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <!-- Rodapé -->
    <footer class="bg-light mt-5 py-4 border-top">
        <div class="container text-center">
            <div class="row mb-4">
                <div class="col-12 d-flex flex-column flex-md-row justify-content-center gap-4">
                    <a href="https://wa.me/5561996696971" target="_blank" class="btn btn-light d-flex align-items-center justify-content-center gap-2 text-dark px-3 py-2 btn-contato">
                        <i class="bi bi-whatsapp fs-4 social-icon"></i>
                        <span class="fw-bold">Converse com um Consultor Ótico!</span>
                    </a>
                    <a href="https://www.instagram.com/oticasvisaoformosa/" target="_blank" class="btn btn-light d-flex align-items-center justify-content-center gap-2 text-dark px-3 py-2 btn-contato">
                        <i class="bi bi-instagram fs-4 social-icon"></i>
                        <span class="fw-bold">Nos siga no Instagram</span>
                    </a>
                </div>
            </div>
            <div class="row">
                <div class="col-12">
                    <hr class="text-muted">
                    <p class="mb-0 text-muted small">&copy; 2026 Óticas Visão. Todos os direitos reservados.</p>
                </div>
            </div>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/global.js"></script>

    <script>
        // --- PROGRAMAÇÃO FUNCIONAL: FUNÇÕES PURAS & IMUTÁVEIS ---
        const obterUsuarioAtual = () => JSON.parse(localStorage.getItem('usuarioLogado'));

        const normalizarDadosPerfil = ({ nome, email }) => ({
            nome: nome.trim(),
            email: email.trim()
        });

        const validarSenhasOpcionais = (novaSenha, confirmaSenha) =>
            novaSenha === '' || novaSenha === confirmaSenha;

        const criarUsuarioAtualizado = (usuarioAnterior, dadosRetornados) => ({
            ...usuarioAnterior,
            nome: dadosRetornados.nome,
            email: dadosRetornados.email
        });

        const exibirAlertaPerfil = (mensagem, tipo = 'danger') => {
            const alertMsg = document.getElementById('alertMsg');
            alertMsg.className = `alert alert-${tipo} fw-semibold mb-3`;
            alertMsg.innerText = mensagem;
        };

        // Preenche o formulário inicial a partir do localStorage
        const carregarDados = () => {
            const usuarioLogado = obterUsuarioAtual();
            if (!usuarioLogado) {
                window.location.href = 'login.html';
                return;
            }
            document.getElementById('nome').value = usuarioLogado.nome || '';
            document.getElementById('email').value = usuarioLogado.email || '';
        };

        // Migra endereços caso o usuário altere o e-mail
        const migrarEnderecosSeEmailMudou = (emailAntigo, emailNovo) => {
            if (!emailAntigo || emailAntigo === emailNovo) return;
            const chaveAntiga = `enderecos_${emailAntigo}`;
            const enderecosSalvos = localStorage.getItem(chaveAntiga);
            if (enderecosSalvos) {
                localStorage.setItem(`enderecos_${emailNovo}`, enderecosSalvos);
                localStorage.removeItem(chaveAntiga);
            }
        };

        // Fluxo principal: PUT /api/user (200, 400, 409)
        async function salvarDados(event) {
            event.preventDefault();

            const usuarioAnterior = obterUsuarioAtual();
            if (!usuarioAnterior) return;

            const dadosLimpos = normalizarDadosPerfil({
                nome: document.getElementById('nome').value,
                email: document.getElementById('email').value
            });

            const novaSenha = document.getElementById('novaSenha').value;
            const confirmaSenha = document.getElementById('confirmaSenha').value;

            if (!validarSenhasOpcionais(novaSenha, confirmaSenha)) {
                exibirAlertaPerfil('As novas senhas não coincidem!', 'danger');
                return;
            }

            const btnSalvar = document.getElementById('btnSalvarDados');
            btnSalvar.disabled = true;
            btnSalvar.innerText = 'Salvando...';

            const res = await requisicaoAPI('/api/user', {
                method: 'PUT',
                body: JSON.stringify(dadosLimpos)
            });

            btnSalvar.disabled = false;
            btnSalvar.innerText = 'Alterar meus dados';

            // Tratamento de erros da API (400 e 409)
            if (res.status === 400) {
                exibirAlertaPerfil(res.dados.mensagem || 'Nome e e-mail válidos são obrigatórios.', 'danger');
                return;
            }

            if (res.status === 409) {
                exibirAlertaPerfil(res.dados.mensagem || 'Este e-mail já está em uso por outro usuário.', 'warning');
                return;
            }

            if (!res.ok) {
                exibirAlertaPerfil(res.mensagem || 'Erro ao atualizar dados.', 'danger');
                return;
            }

            // 200 OK: Atualização imutável no localStorage
            const dadosConfirmados = res.dados.dados || dadosLimpos;
            const usuarioAtualizado = criarUsuarioAtualizado(usuarioAnterior, dadosConfirmados);

            migrarEnderecosSeEmailMudou(usuarioAnterior.email, usuarioAtualizado.email);
            localStorage.setItem('usuarioLogado', JSON.stringify(usuarioAtualizado));

            document.getElementById('novaSenha').value = '';
            document.getElementById('confirmaSenha').value = '';

            exibirAlertaPerfil(res.dados.mensagem || 'Dados alterados com sucesso!', 'success');
            atualizarMenuUsuario();
        }

        // --- GESTÃO DE ENDEREÇOS + VIACEP ---
        function formatarCepModal(input) {
            let v = input.value.replace(/\D/g, '').slice(0, 8);
            if (v.length > 5) v = v.slice(0, 5) + '-' + v.slice(5);
            input.value = v;
        }

        async function consultarViaCEP(cepFormatado) {
            const cepLimpo = cepFormatado.replace(/\D/g, '');
            const alertaViaCep = document.getElementById('alertaViaCep');
            alertaViaCep.classList.add('d-none');

            if (cepLimpo.length !== 8) return;

            try {
                const resp = await fetch(`https://viacep.com.br/ws/${cepLimpo}/json/`);
                const dados = await resp.json();

                if (dados.erro) {
                    alertaViaCep.classList.remove('d-none');
                    alertaViaCep.innerText = 'CEP não encontrado no ViaCEP. Preencha manualmente.';
                    return;
                }

                if (dados.logradouro) document.getElementById('rua').value = dados.logradouro;
                if (dados.bairro) document.getElementById('bairro').value = dados.bairro;
                if (dados.localidade && dados.uf) {
                    document.getElementById('cidadeEstado').value = `${dados.localidade} / ${dados.uf}`;
                }
            } catch (err) {
                console.warn('Falha ao consultar ViaCEP:', err);
            }
        }

        function carregarEnderecos() {
            const usuarioLogado = obterUsuarioAtual();
            if (!usuarioLogado) return;
            
            const container = document.getElementById('container-enderecos');
            const enderecos = JSON.parse(localStorage.getItem(`enderecos_${usuarioLogado.email}`)) || [];
            
            if (enderecos.length === 0) {
                container.innerHTML = '<div class="col-12 text-muted text-center py-4"><i class="bi bi-geo-alt fs-2 d-block mb-2"></i>Nenhum endereço cadastrado.</div>';
                return;
            }

            container.innerHTML = enderecos.map((end, index) => `
                <div class="col-md-6">
                    <div class="card border p-3 h-100 position-relative">
                        <input type="hidden" value="${index}">
                        <div class="d-flex justify-content-between align-items-start mb-1">
                            <h6 class="fw-bold mb-0"><i class="bi bi-geo-alt me-2"></i>${end.rotulo}</h6>
                            <div class="d-flex align-items-center gap-2">
                                ${index === 0 ? '<span class="badge bg-secondary">Principal</span>' : ''}
                                <button type="button" class="btn btn-sm text-danger p-0 border-0" title="Excluir endereço" onclick="removerEndereco(${index})">
                                    <i class="bi bi-trash"></i>
                                </button>
                            </div>
                        </div>
                        <p class="text-muted small mb-1">${end.rua}</p>
                        <p class="text-muted small mb-1">${end.bairro} - ${end.cidadeEstado || 'Formosa / GO'}</p>
                        <p class="text-muted small mb-0">CEP: ${end.cep}</p>
                    </div>
                </div>
            `).join('');
        }

        function adicionarEndereco(e) {
            e.preventDefault();
            const usuarioLogado = obterUsuarioAtual();
            if (!usuarioLogado) return;

            const novoEndereco = {
                rotulo: document.getElementById('rotulo').value.trim(),
                rua: document.getElementById('rua').value.trim(),
                bairro: document.getElementById('bairro').value.trim(),
                cidadeEstado: document.getElementById('cidadeEstado').value.trim(),
                cep: document.getElementById('cep').value.trim()
            };

            const enderecos = JSON.parse(localStorage.getItem(`enderecos_${usuarioLogado.email}`)) || [];
            const listaAtualizada = [...enderecos, novoEndereco];
            localStorage.setItem(`enderecos_${usuarioLogado.email}`, JSON.stringify(listaAtualizada));

            const modalEl = document.getElementById('modalEndereco');
            const modal = bootstrap.Modal.getInstance(modalEl);
            if (modal) modal.hide();

            document.getElementById('formNovoEndereco').reset();
            carregarEnderecos(); 
        }

        function removerEndereco(indice) {
            const usuarioLogado = obterUsuarioAtual();
            if (!usuarioLogado) return;

            const enderecos = JSON.parse(localStorage.getItem(`enderecos_${usuarioLogado.email}`)) || [];
            const listaFiltrada = enderecos.filter((_, idx) => idx !== indice);
            localStorage.setItem(`enderecos_${usuarioLogado.email}`, JSON.stringify(listaFiltrada));
            carregarEnderecos();
        }

        document.addEventListener('DOMContentLoaded', () => {
            carregarDados();
            carregarEnderecos();
        });
    </script>
</body>
</html>
