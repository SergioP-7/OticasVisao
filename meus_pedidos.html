<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meus Pedidos - Óticas Visão</title>
    <link rel="stylesheet" href="css/estilos.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="icon" type="image/svg+xml" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/icons/eyeglasses.svg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
</head>
<body>

    <header class="navbar">
        <div class="dropdown" style="display: inline-block;">
            <button type="button" class="btn-user-menu" data-bs-toggle="dropdown" aria-expanded="false" aria-label="Menu do usuário">
              <img src="img/icone-user.png" alt="Ícone de Usuário" class="user-img">
            </button>
            <ul class="dropdown-menu dropdown-menu-start me-3" id="menuUsuario"></ul>
        </div>
            
        <div class="brand">
            <a href="index.html" class="paginainicial-icone" aria-label="Página Inicial">
                <img src="img/logo-paginainicial.jpg" alt="Icone Home" class="paginainicial-img">
            </a>
        </div>
    </header>

    <!-- Conteúdo Principal -->
    <main class="container my-5 flex-grow-1">
        
        <div class="d-flex flex-column flex-sm-row justify-content-between align-items-sm-center gap-3 mb-4">
            <h2 class="mb-0">Meus Pedidos</h2>
            <a href="pagdeprodutos.html" class="btn btn-outline-dark">Continuar Comprando</a>
        </div>

        <!-- Alerta global para retornos do DELETE /api/pedido (200, 400, 404, 422) -->
        <div id="alerta-pedidos" class="alert d-none fw-semibold mb-4" role="alert"></div>

        <!-- Barra rápida para testar protocolos simulados da API (PED-0000 -> 404, PED-ENVIADO -> 422) -->
        <div class="card border-0 bg-light shadow-sm mb-4">
            <div class="card-body py-3 px-4 d-flex flex-column flex-md-row align-items-md-center justify-content-between gap-2">
                <div class="small text-muted">
                    <i class="bi bi-wrench-adjustable me-1"></i>
                    <strong>Simulador de Cancelamento API:</strong> teste protocolos especiais (<code>PED-0000</code> = 404, <code>PED-ENVIADO</code> = 422)
                </div>
                <div class="input-group input-group-sm" style="max-width: 340px;">
                    <input type="text" id="input-protocolo-teste" class="form-control text-uppercase" placeholder="Ex: PED-0000 ou PED-ENVIADO">
                    <button type="button" class="btn btn-outline-danger fw-semibold" onclick="cancelarPedidoPorInput()">
                        Testar Cancelamento
                    </button>
                </div>
            </div>
        </div>

        <!-- Grade de Pedidos (Preenchida dinamicamente via localStorage) -->
        <div class="row g-4" id="container-pedidos"></div>
    </main>

    <!-- Rodapé -->
    <footer class="bg-light mt-5 py-4 border-top">
        <div class="container text-center">
            <div class="row mb-4">
                <div class="col-12 d-flex flex-column flex-md-row justify-content-center gap-4">
                    <a href="https://wa.me/5561996696971" target="_blank" class="btn btn-light d-flex align-items-center justify-content-center gap-2 text-dark px-3 py-2 btn-contato">
                        <i class="bi bi-whatsapp fs-4 social-icon"></i>
                        <span class="fw-bold">Converse com um Consultor Ótico!</span>
                    </a>
                    <a href="https://www.instagram.com/oticasvisaoformosa/" target="_blank" class="btn btn-light d-flex align-items-center justify-content-center gap-2 text-dark px-3 py-2 btn-contato">
                        <i class="bi bi-instagram fs-4 social-icon"></i>
                        <span class="fw-bold">Nos siga no Instagram</span>
                    </a>
                </div>
            </div>
            <div class="row">
                <div class="col-12">
                    <hr class="text-muted">
                    <p class="mb-0 text-muted small">&copy; 2026 Óticas Visão. Todos os direitos reservados.</p>
                </div>
            </div>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/global.js"></script>

    <script>
        function exibirAlertaPedidos(mensagem, tipo = 'danger') {
            const alerta = document.getElementById('alerta-pedidos');
            if (!alerta) return;
            alerta.className = `alert alert-${tipo} fw-semibold mb-4`;
            alerta.innerText = mensagem;
            alerta.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
        }

        function obterClasseBadgeStatus(status) {
            const s = (status || '').toLowerCase();
            if (s === 'cancelado') return 'bg-danger text-white';
            if (s === 'entregue') return 'bg-success text-white';
            return 'bg-warning text-dark';
        }

        // Renderiza os pedidos do localStorage (pedidosOtica)
        function renderizarPedidos() {
            const container = document.getElementById('container-pedidos');
            const pedidos = JSON.parse(localStorage.getItem('pedidosOtica')) || [];

            if (pedidos.length === 0) {
                container.innerHTML = `
                    <div class="col-12 text-center py-5">
                        <i class="bi bi-box-seam text-muted" style="font-size: 3rem;"></i>
                        <h4 class="mt-3">Você ainda não tem pedidos</h4>
                        <p class="text-muted">Quando finalizar uma compra, ela aparecerá aqui.</p>
                        <a href="pagdeprodutos.html" class="btn btn-dark mt-2">Explorar Produtos</a>
                    </div>`;
                return;
            }

            // Cria uma cópia invertida (mais recente primeiro) sem mutar o array original
            const pedidosOrdenados = [...pedidos].reverse();

            container.innerHTML = pedidosOrdenados.map(pedido => {
                const protocolo = pedido.protocolo || String(pedido.id);
                const statusAtual = pedido.status || 'Aprovado';
                const jaCancelado = statusAtual.toLowerCase() === 'cancelado';
                const textoItens = pedido.totalItens === 1 ? '1 item' : `${pedido.totalItens} itens`;
                const valorTotal = pedido.valorTotal !== undefined ? pedido.valorTotal : (pedido.valorProdutos || 0);
                const valorFormatado = valorTotal.toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });

                return `
                <div class="col-12">
                    <div class="card shadow-sm border-0">
                        <div class="card-header bg-white border-bottom-0 pt-4 pb-2 d-flex flex-column flex-md-row justify-content-between align-items-md-center">
                            <h5 class="mb-2 mb-md-0 fw-bold">Pedido #${protocolo}</h5>
                            <span class="badge ${obterClasseBadgeStatus(statusAtual)} px-3 py-2 rounded-pill text-capitalize">${statusAtual}</span>
                        </div>
                        <div class="card-body pt-0">
                            <hr class="text-muted opacity-25">
                            <div class="row align-items-center">
                                <div class="col-md-7 mb-3 mb-md-0">
                                    <p class="text-muted mb-1"><i class="bi bi-calendar3 me-2"></i>Realizado em: ${pedido.data || '-'}</p>
                                    <p class="mb-1"><i class="bi bi-box-seam me-2"></i>${textoItens}</p>
                                    <p class="mb-0 fw-bold text-danger fs-5">Total: ${valorFormatado}</p>
                                </div>
                                <div class="col-md-5 d-flex flex-column flex-sm-row justify-content-md-end gap-2">
                                    <a href="detalhe_pedido.html?id=${encodeURIComponent(protocolo)}" class="btn btn-dark">
                                        Visualizar Detalhes do Pedido
                                    </a>
                                    ${jaCancelado ? '' : `
                                    <button type="button" class="btn btn-outline-danger" onclick="cancelarPedido('${protocolo}', this)">
                                        Cancelar Pedido
                                    </button>`}
                                </div>
                            </div>
                        </div>
                    </div>
                </div>`;
            }).join('');
        }

        // Chama DELETE /api/pedido com protocolo via query string e trata 200, 400, 404 e 422
        async function cancelarPedido(protocolo, botaoEl = null) {
            if (botaoEl) {
                botaoEl.disabled = true;
                botaoEl.innerText = 'Cancelando...';
            }

            const query = protocolo ? `?protocolo=${encodeURIComponent(protocolo)}` : '';
            const res = await requisicaoAPI(`/api/pedido${query}`, {
                method: 'DELETE'
            });

            if (botaoEl) {
                botaoEl.disabled = false;
                botaoEl.innerText = 'Cancelar Pedido';
            }

            if (res.status === 400) {
                exibirAlertaPedidos(res.dados.mensagem || 'O protocolo do pedido é obrigatório.', 'danger');
                return;
            }

            if (res.status === 404) {
                exibirAlertaPedidos(res.dados.mensagem || 'Pedido não encontrado.', 'danger');
                return;
            }

            if (res.status === 422) {
                exibirAlertaPedidos(res.dados.mensagem || 'Não é possível cancelar um pedido que já foi enviado.', 'warning');
                return;
            }

            if (!res.ok) {
                exibirAlertaPedidos(res.mensagem || 'Erro ao cancelar o pedido.', 'danger');
                return;
            }

            // 200 OK: Atualiza o status do pedido para "cancelado" no localStorage (de forma imutável)
            const pedidos = JSON.parse(localStorage.getItem('pedidosOtica')) || [];
            const pedidosAtualizados = pedidos.map(p => {
                const cod = p.protocolo || String(p.id);
                return cod === protocolo ? { ...p, status: 'cancelado' } : p;
            });

            localStorage.setItem('pedidosOtica', JSON.stringify(pedidosAtualizados));
            exibirAlertaPedidos(res.dados.mensagem || `Pedido #${protocolo} cancelado com sucesso!`, 'success');
            renderizarPedidos();
        }

        function cancelarPedidoPorInput() {
            const protocolo = document.getElementById('input-protocolo-teste')?.value.trim().toUpperCase() || '';
            cancelarPedido(protocolo);
        }

        document.addEventListener('DOMContentLoaded', () => {
            renderizarPedidos();
        });
    </script>
</body>
</html>
