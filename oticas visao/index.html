<!DOCTYPE html>

<head>

<body>

</header>

    <main class="home-container">

    <!-- 2. Destaques/Categorias em Cards Grandes -->

        <div class="card-categoria">

        </div>
        <div class="card-categoria">

 <section class="beneficios-loja">
