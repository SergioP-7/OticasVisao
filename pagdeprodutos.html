<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Óticas Visão - Nossos Produtos</title>
    <link rel="stylesheet" href="css/estilos.css">
    <link rel="stylesheet" href="css/pagdeprodutos.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="icon" type="image/svg+xml" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/icons/eyeglasses.svg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
</head>
<body>

    <!-- Menu de Navegação Completo e Limpo -->
    <header class="navbar">
        
        <!-- 1. Menu do Usuário -->
        <div class="dropdown d-inline-block">
            <button type="button" class="btn-user-menu" data-bs-toggle="dropdown" aria-expanded="false" aria-label="Menu do usuário">
              <img src="img/icone-user.png" alt="Ícone de Usuário" class="user-img">
            </button>
            <ul class="dropdown-menu dropdown-menu-start me-3" id="menuUsuario">
                 <!-- O js/global.js injeta os links aqui -->
            </ul>
        </div>

        <!-- 2. Caixa de Pesquisa + Filtro por Categoria (Requisito 3.a) -->
        <div class="caixa-pesquisa d-flex align-items-center gap-2">
            <select id="filtroCategoriaHeader" class="form-select form-select-sm border-0 bg-light" style="max-width: 170px; border-radius: 20px;" aria-label="Filtrar por categoria">
                <option value="">Todas as Categorias</option>
                <option value="Vestuário">Vestuário</option>
                <option value="Eletrônicos">Eletrônicos</option>
                <option value="Calçados">Calçados</option>
                <option value="Eletrodomésticos">Eletrodomésticos</option>
                <option value="Acessórios">Acessórios</option>
                <option value="Móveis">Móveis</option>
            </select>
            <input type="text" id="inputBusca" placeholder="Buscar produtos...">
            <button type="button" id="btnBuscar">Buscar</button>
        </div>

        <!-- 3. Localização e Carrinho (Alvo do Drag & Drop) -->
        <div class="cart-container">
            <a href="contato.html" class="loclojas-icone" aria-label="Localização das Lojas">
                <img src="img/loc-icone.jpg" alt="Icone Localização" class="loclojas-img">
            </a>
            <a href="carrinho.html" id="alvo-drop-carrinho" class="carrinho-icone rounded-circle p-1 transition" aria-label="Carrinho de compras" title="Arraste um produto aqui para adicionar">
                <img src="img/carrinho.png" alt="Carrinho de Compras" class="carrinho-img">
                <span class="cart-count">0</span>
            </a>
        </div>

    </header>

    <main>
        <!-- Container do Catálogo (Filtros na esquerda, Produtos na direita) -->
        <section class="catalogo-container">
            
            <!-- Barra Lateral de Filtros (Categorias da API) -->
            <aside class="filtros-sidebar">
                <h3>Categorias</h3>
                <ul id="lista-categorias">
                    <li><a href="#" class="filtro-cat active fw-bold" data-categoria="">Todos os Produtos</a></li>
                    <li><a href="#" class="filtro-cat" data-categoria="Vestuário">Vestuário</a></li>
                    <li><a href="#" class="filtro-cat" data-categoria="Eletrônicos">Eletrônicos</a></li>
                    <li><a href="#" class="filtro-cat" data-categoria="Calçados">Calçados</a></li>
                    <li><a href="#" class="filtro-cat" data-categoria="Eletrodomésticos">Eletrodomésticos</a></li>
                    <li><a href="#" class="filtro-cat" data-categoria="Acessórios">Acessórios</a></li>
                    <li><a href="#" class="filtro-cat" data-categoria="Móveis">Móveis</a></li>
                </ul>
            </aside>

            <!-- Grade de Produtos Dinâmica (GET /api/products) -->
            <div class="row g-4 flex-grow-1" id="lista-produtos">
                <!-- Os cards da API serão renderizados aqui -->
            </div>
        </section>
    </main>

    <footer class="bg-light mt-5 py-4 border-top">
        <div class="container text-center">
            <div class="row mb-4">
                <div class="col-12 d-flex flex-column flex-md-row justify-content-center gap-4">
                    <a href="https://wa.me/5561996696971" target="_blank" class="btn btn-light d-flex align-items-center justify-content-center gap-2 text-dark px-3 py-2 btn-contato">
                        <i class="bi bi-whatsapp fs-4 social-icon"></i>
                        <span class="fw-bold">Converse com um Consultor Ótico!</span>
                    </a>
                    <a href="https://www.instagram.com/oticasvisaoformosa/" target="_blank" class="btn btn-light d-flex align-items-center justify-content-center gap-2 text-dark px-3 py-2 btn-contato">
                        <i class="bi bi-instagram fs-4 social-icon"></i>
                        <span class="fw-bold">Nos siga no Instagram</span>
                    </a>
                </div>
            </div>
            
            <div class="row">
                <div class="col-12">
                    <hr class="text-muted">
                    <p class="mb-0 text-muted small">&copy; 2026 Óticas Visão. Todos os direitos reservados.</p>
                </div>
            </div>
        </div>
    </footer>

    <!-- Toast Container -->
    <div class="toast-container position-fixed bottom-0 end-0 p-3" style="z-index: 1050">
        <div id="toastCarrinho" class="toast align-items-center text-white bg-success border-0" role="alert" aria-live="assertive" aria-atomic="true">
            <div class="d-flex">
                <div class="toast-body">
                    <i id="toastIcone" class="bi bi-check-circle-fill me-2"></i>
                    <span id="toastMsg">Produto adicionado ao carrinho!</span>
                </div>
                <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast" aria-label="Fechar"></button>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/global.js"></script>

    <script>
        let categoriaAtual = "";
        let timeoutBusca = null;
        let catalogoAtual = [];

        function exibirToast(mensagem, tipo = "success") {
            const toastEl = document.getElementById("toastCarrinho");
            const toastMsg = document.getElementById("toastMsg");
            const toastIcone = document.getElementById("toastIcone");
            if (!toastEl || !toastMsg) return;

            if (tipo === "warning") {
                toastEl.className = "toast align-items-center text-dark bg-warning border-0";
                if (toastIcone) toastIcone.className = "bi bi-exclamation-triangle-fill me-2";
            } else if (tipo === "danger") {
                toastEl.className = "toast align-items-center text-white bg-danger border-0";
                if (toastIcone) toastIcone.className = "bi bi-x-circle-fill me-2";
            } else {
                toastEl.className = "toast align-items-center text-white bg-success border-0";
                if (toastIcone) toastIcone.className = "bi bi-check-circle-fill me-2";
            }

            toastMsg.innerText = mensagem;
            bootstrap.Toast.getOrCreateInstance(toastEl).show();
        }

        // Desafio Extra: Wishlist (wishlistOtica no localStorage)
        function alternarWishlist(idProduto, botaoEl) {
            let wishlist = JSON.parse(localStorage.getItem("wishlistOtica")) || [];
            const jaFavoritado = wishlist.includes(idProduto);

            if (jaFavoritado) {
                wishlist = wishlist.filter(id => id !== idProduto);
            } else {
                wishlist = [...wishlist, idProduto];
            }

            localStorage.setItem("wishlistOtica", JSON.stringify(wishlist));

            const icone = botaoEl.querySelector("i");
            if (icone) {
                icone.className = jaFavoritado ? "bi bi-heart text-muted" : "bi bi-heart-fill text-danger";
            }
        }

        // Carrega os produtos da API (GET /api/products)
        async function carregarProdutos(busca = "", categoria = "") {
            const grade = document.getElementById("lista-produtos");
            if (!grade) return;

            grade.innerHTML = `
                <div class="col-12 text-center py-5">
                    <div class="spinner-border text-danger" role="status"></div>
                    <p class="mt-2 text-muted">Carregando catálogo...</p>
                </div>
            `;

            const params = new URLSearchParams();
            if (busca.trim()) params.append("search", busca.trim());
            if (categoria.trim()) params.append("category", categoria.trim());

            const endpoint = params.toString() ? `/api/products?${params.toString()}` : "/api/products";
            const res = await requisicaoAPI(endpoint);

            if (!res.ok) {
                grade.innerHTML = `
                    <div class="col-12">
                        <div class="alert alert-danger text-center">${res.mensagem}</div>
                    </div>
                `;
                return;
            }

            const produtos = res.dados.products || [];
            catalogoAtual = produtos;
            const wishlist = JSON.parse(localStorage.getItem("wishlistOtica")) || [];

            if (produtos.length === 0) {
                grade.innerHTML = `
                    <div class="col-12 text-center py-5">
                        <p class="text-muted fs-5">Nenhum produto encontrado para o filtro selecionado.</p>
                    </div>
                `;
                return;
            }

            grade.innerHTML = produtos.map(produto => {
                const esgotado = produto.stock === 0;
                const favoritado = wishlist.includes(produto.id);
                const precoFormatado = produto.price.toLocaleString("pt-BR", { style: "currency", currency: "BRL" });
                const nomeEscapado = produto.name.replace(/'/g, "\\'");

                return `
                    <div class="col-12 col-sm-6 col-md-4">
                        <div class="card h-100 text-center shadow-sm border-0 produto-card ${esgotado ? 'opacity-75' : ''}">
                            <!-- Campo hidden para armazenar o ID do produto -->
                            <input type="hidden" name="produto_id" value="${produto.id}">

                            <div class="position-relative">
                                ${esgotado 
                                    ? '<span class="badge bg-secondary position-absolute top-0 start-0 m-2 px-3 py-2">Esgotado</span>' 
                                    : `<span class="badge bg-light text-dark border position-absolute top-0 start-0 m-2">${produto.category}</span>`
                                }

                                <!-- Botão Wishlist -->
                                <button type="button" class="btn btn-light btn-sm rounded-circle shadow-sm position-absolute top-0 end-0 m-2" onclick="alternarWishlist(${produto.id}, this)" aria-label="Favoritar produto" title="Adicionar aos favoritos">
                                    <i class="${favoritado ? 'bi bi-heart-fill text-danger' : 'bi bi-heart text-muted'}"></i>
                                </button>

                                <!-- Imagem arrastável (Drag & Drop para o carrinho) -->
                                <img 
                                    src="${produto.image}" 
                                    class="card-img-top p-3" 
                                    alt="${produto.name}" 
                                    draggable="${!esgotado}"
                                    ondragstart="iniciarArrasteProduto(event, ${produto.id})"
                                    style="height: 160px; object-fit: contain; ${esgotado ? '' : 'cursor: grab;'}"
                                    title="${esgotado ? 'Produto esgotado' : 'Arraste até o carrinho para adicionar'}">
                            </div>

                            <div class="card-body d-flex flex-column">
                                <span class="produto-marca text-muted small text-uppercase">${produto.category}</span>
                                <h5 class="card-title mt-1 mb-2 fs-6 fw-bold">${produto.name}</h5>
                                <p class="card-text text-muted small mb-3">${produto.description}</p>
                                
                                <p class="card-text fw-bold text-danger fs-5 mt-auto mb-1">${precoFormatado}</p>
                                <small class="mb-3 ${esgotado ? 'text-danger fw-bold' : 'text-success'}">
                                    ${esgotado ? 'Produto esgotado (0 un.)' : `Estoque: ${produto.stock} un.`}
                                </small>

                                <button 
                                    type="button"
                                    class="btn ${esgotado ? 'btn-secondary' : 'btn-dark btn-add-carrinho'} w-100 fw-bold"
                                    ${esgotado ? 'disabled' : `onclick="adicionarAoCarrinho(${produto.id}, '${nomeEscapado}', ${produto.price}, '${produto.image}', ${produto.stock})"`}>
                                    ${esgotado ? 'Indisponível' : 'Adicionar'}
                                </button>
                            </div>
                        </div>
                    </div>
                `;
            }).join("");
        }

        // Adiciona produto ao localStorage (carrinhoOtica) respeitando o estoque máximo
        function adicionarAoCarrinho(id, titulo, preco, imagem, stock) {
            if (stock !== undefined && stock <= 0) {
                exibirToast(`${titulo} está esgotado no momento!`, "danger");
                return;
            }

            let carrinho = JSON.parse(localStorage.getItem('carrinhoOtica')) || [];
            let produtoExistente = carrinho.find(produto => produto.id === id);

            if (produtoExistente) {
                const estoqueLimite = stock !== undefined ? stock : (produtoExistente.stock ?? Infinity);
                if (produtoExistente.quantidade >= estoqueLimite) {
                    exibirToast(`Limite de estoque atingido! Máximo de ${estoqueLimite} un. para "${titulo}".`, "warning");
                    return;
                }
                produtoExistente.quantidade += 1;
                if (stock !== undefined) produtoExistente.stock = stock;
            } else {
                carrinho.push({ id, titulo, preco, imagem, stock, quantidade: 1 });
            }

            localStorage.setItem('carrinhoOtica', JSON.stringify(carrinho));
            atualizarBadgeCarrinho();
            exibirToast(`${titulo} adicionado ao carrinho!`, "success");
        }

        // --- DESAFIO EXTRA: DRAG & DROP PARA O ÍCONE DO CARRINHO ---
        function iniciarArrasteProduto(event, produtoId) {
            event.dataTransfer.setData("text/plain", String(produtoId));
        }

        function configurarDropNoCarrinho() {
            const alvoCarrinho = document.getElementById("alvo-drop-carrinho");
            if (!alvoCarrinho) return;

            alvoCarrinho.addEventListener("dragover", (e) => {
                e.preventDefault();
                alvoCarrinho.classList.add("bg-warning-subtle", "shadow-sm");
            });

            alvoCarrinho.addEventListener("dragleave", () => {
                alvoCarrinho.classList.remove("bg-warning-subtle", "shadow-sm");
            });

            alvoCarrinho.addEventListener("drop", (e) => {
                e.preventDefault();
                alvoCarrinho.classList.remove("bg-warning-subtle", "shadow-sm");

                const produtoId = parseInt(e.dataTransfer.getData("text/plain"), 10);
                const produto = catalogoAtual.find(p => p.id === produtoId);

                if (produto) {
                    adicionarAoCarrinho(produto.id, produto.name, produto.price, produto.image, produto.stock);
                }
            });
        }

        // Inicialização dos eventos de busca, filtro e carregamento inicial
        document.addEventListener("DOMContentLoaded", () => {
            configurarDropNoCarrinho();

            const parametrosDaURL = new URLSearchParams(window.location.search);
            const termoInicial = parametrosDaURL.get("busca") || parametrosDaURL.get("search") || "";
            const categoriaInicial = parametrosDaURL.get("categoria") || parametrosDaURL.get("category") || "";

            const inputBusca = document.getElementById("inputBusca");
            const btnBuscar = document.getElementById("btnBuscar");

            if (inputBusca && termoInicial) {
                inputBusca.value = termoInicial.replace(/-/g, " ");
            }

            // Busca com debounce ao digitar
            if (inputBusca) {
                inputBusca.addEventListener("input", () => {
                    clearTimeout(timeoutBusca);
                    timeoutBusca = setTimeout(() => {
                        carregarProdutos(inputBusca.value, categoriaAtual);
                    }, 350);
                });
            }

            // Busca imediata ao clicar no botão "Buscar"
            if (btnBuscar && inputBusca) {
                btnBuscar.addEventListener("click", () => {
                    clearTimeout(timeoutBusca);
                    carregarProdutos(inputBusca.value, categoriaAtual);
                });
            }

            const selectCategoria = document.getElementById("filtroCategoriaHeader");

            // Cliques nos links de categoria da barra lateral
            document.querySelectorAll(".filtro-cat").forEach(link => {
                link.addEventListener("click", (e) => {
                    e.preventDefault();
                    document.querySelectorAll(".filtro-cat").forEach(l => l.classList.remove("active", "fw-bold"));
                    link.classList.add("active", "fw-bold");

                    categoriaAtual = link.getAttribute("data-categoria");
                    if (selectCategoria) selectCategoria.value = categoriaAtual;
                    carregarProdutos(inputBusca ? inputBusca.value : "", categoriaAtual);
                });
            });

            // Quando mudar a categoria no <select> do cabeçalho
            if (selectCategoria) {
                selectCategoria.value = categoriaInicial;
                selectCategoria.addEventListener("change", () => {
                    categoriaAtual = selectCategoria.value;

                    document.querySelectorAll(".filtro-cat").forEach(l => {
                        const catLink = l.getAttribute("data-categoria");
                        l.classList.toggle("active", catLink === categoriaAtual);
                        l.classList.toggle("fw-bold", catLink === categoriaAtual);
                    });

                    carregarProdutos(inputBusca ? inputBusca.value : "", categoriaAtual);
                });
            }

            categoriaAtual = categoriaInicial;
            carregarProdutos(inputBusca ? inputBusca.value : "", categoriaAtual);
        });
    </script>

</body>
</html>
